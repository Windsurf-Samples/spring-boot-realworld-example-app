version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    volumes:
      - ./auth-dev.db:/app/auth-dev.db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/auth-dev.db

  main-app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./dev.db:/app/dev.db
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/dev.db
    depends_on:
      - auth-service
