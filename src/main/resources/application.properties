spring.datasource.url=${DATABASE_URL:jdbc:sqlite:dev.db}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

image.default=${DEFAULT_USER_IMAGE:https://static.productionready.io/images/smiley-cyrus.jpg}

jwt.secret=${JWT_SECRET:nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA}
jwt.sessionTime=${JWT_SESSION_TIME:86400}

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

logging.level.io.spring.infrastructure.mybatis.readservice.ArticleReadService=${LOG_LEVEL_ARTICLE:INFO}
logging.level.io.spring.infrastructure.mybatis.mapper=${LOG_LEVEL_MAPPER:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
